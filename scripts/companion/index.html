  <defs>
    <style>
      /* Slow, rhythmic deep breathing animation */
      .cs-breathe {
        transform-origin: 7.5px 15px; /* Pivot at the floor to expand upwards */
        animation: cs-breathe-squash 4.5s infinite ease-in-out;
      }

      /* Shadow expands slightly as the body inflates */
      .cs-shadow-breathe {
        transform-origin: 7.5px 15.5px;
        animation: cs-shadow-pulse 4.5s infinite ease-in-out;
      }

      /* Zzz Particle Base Styles */
      .cs-z-particle {
        opacity: 0;
      }
      .cs-z1 { animation: cs-float-1 6s infinite ease-in-out; animation-delay: 0s; }
      .cs-z2 { animation: cs-float-2 6s infinite ease-in-out; animation-delay: 2s; }
      .cs-z3 { animation: cs-float-3 6s infinite ease-in-out; animation-delay: 4s; }

      /* Breathing Keyframes (Slow inhale, hold, exhale, pause) */
      @keyframes cs-breathe-squash {
        0%, 80%, 100% { transform: scale(1, 1); }
        30%, 40% { transform: scale(1.02, 1.25); } /* Chest expands/inflates */
      }

      @keyframes cs-shadow-pulse {
        0%, 80%, 100% { transform: scaleX(1); opacity: 0.4; }
        30%, 40% { transform: scaleX(1.05); opacity: 0.5; }
      }

      /* Swaying and fading floating Z keyframes (Adjusted for lowered head) */
      @keyframes cs-float-1 {
        0%   { transform: translate(5px, 8px) scale(0.4); opacity: 0; }
        10%  { opacity: 1; }
        30%  { transform: translate(9px, 4px) scale(0.6); }
        50%  { transform: translate(4px, 0px) scale(0.8); }
        70%  { transform: translate(8px, -4px) scale(1.0); }
        90%  { opacity: 0.8; }
        100% { transform: translate(6px, -8px) scale(1.1); opacity: 0; }
      }

      @keyframes cs-float-2 {

  <defs>
    <style>
      /* Bouncing Character Body */
      .hs-bounce-anim {
        transform-box: fill-box;
        transform-origin: 50% 100%; /* Base of the feet */
        animation: hs-bounce 1s infinite ease-in-out;
      }
      
      /* Ground Shadow Pulse */
      .hs-shadow-anim {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: hs-shadow 1s infinite ease-in-out;
      }

      /* Enthusiastic Waving Arms */
      .hs-arm-l {
        transform-box: fill-box;
        transform-origin: 100% 50%; /* Shoulder joint */
        animation: hs-wave-l 0.15s infinite alternate ease-in-out;
      }
      .hs-arm-r {
        transform-box: fill-box;
        transform-origin: 0% 50%; /* Shoulder joint */
        animation: hs-wave-r 0.15s infinite alternate ease-in-out;
      }

      /* Happy Blinking Eyes */
      .hs-eyes-blink {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: hs-blink 2s infinite linear;
      }

      /* Pixel-Art Sparkle Animations (Frame-by-frame style) */
      .hs-spark-center {
        opacity: 0;
        animation: hs-flash-center 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }
      
      .hs-spark-outer {
        opacity: 0;
        animation: hs-flash-outer 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }

      /* Character Keyframes */
      @keyframes hs-bounce {
        0%, 15%, 100% { transform: translateY(0) scaleY(1); }
        20% { transform: translateY(0) scaleY(0.85); }     /* Anticipation squash */
        40% { transform: translateY(-10px) scaleY(1.05); } /* Fast up + stretch */
        50% { transform: translateY(-12px) scaleY(1); }    /* Hangtime peak */
        60% { transform: translateY(-10px) scaleY(1.05); } /* Fast fall + stretch */
        80% { transform: translateY(0) scaleY(0.85); }     /* Landing squash */
        85% { transform: translateY(0) scaleY(1); }        /* Recover */
      }

      @keyframes hs-shadow {
        0%, 15%, 100% { transform: scale(1); opacity: 0.5; }
        20% { transform: scale(1.1); opacity: 0.6; }
        40% { transform: scale(0.6); opacity: 0.2; }
        50% { transform: scale(0.5); opacity: 0.15; }
        60% { transform: scale(0.6); opacity: 0.2; }
        80% { transform: scale(1.1); opacity: 0.6; }
        85% { transform: scale(1); opacity: 0.5; }
      }

      @keyframes hs-wave-l {
        0% { transform: rotate(45deg); }
        100% { transform: rotate(85deg); }
      }

      @keyframes hs-wave-r {
        0% { transform: rotate(-45deg); }
        100% { transform: rotate(-85deg); }
      }

      @keyframes hs-blink {
        0%, 46%, 54%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }

      /* 
        True 8-Bit Sparkle Timeline:
        1. Small center dot appears
        2. Outer arms appear (Full Star)
        3. Center dot disappears (Hollow Ring)
        4. Everything disappears 
      */
      @keyframes hs-flash-center {
        0%  { opacity: 0; }
        10% { opacity: 1; }  /* Small dot */
        30% { opacity: 0; }  /* Disappears, leaving hollow star */
        100%{ opacity: 0; }
      }
      
      @keyframes hs-flash-outer {
        0%  { opacity: 0; }
        20% { opacity: 1; }  /* Outer arms appear to complete the star */
        40% { opacity: 0; }  /* Entire star disappears */
        100%{ opacity: 0; }
      }
    </style>

            <g transform="translate(228 141) scale(3.65)"><g class="normal-clawd"><g class="clawd ct-root">
  <defs>
    <style>
      /* ===== Body (KEEP) ===== */
      .ct-body-bounce {
        transform-origin: 7.5px 15px;
        animation: ct-body-bounce 0.35s infinite ease-in-out;
      }
      .ct-breathe {
        transform-origin: 7.5px 13px;
        animation: ct-breathe 3.2s infinite ease-in-out;
      }

      /* ===== Arms (KEEP) ===== */
      .ct-arm-l-type {
        transform-origin: 2px 10px;
        animation: ct-type-l 0.15s infinite ease-in-out;
      }
      .ct-arm-r-type {
        transform-origin: 13px 10px;
        animation: ct-type-r 0.12s infinite ease-in-out;
      }

      /* ===== Eyes ===== */
      .ct-eyes-code {
        transform-origin: 7.5px 9px;
        animation: ct-eye-code 10s infinite ease-in-out;
      }

      /* ===== Code lines: each line grows, holds, then slides up + fades ===== */
      .ct-code-line {
        transform-box: fill-box;
        transform-origin: left center;
      }
      .ct-cl1 { animation: ct-cl1 6s infinite; }
      .ct-cl2 { animation: ct-cl2 6s infinite; }
      .ct-cl3 { animation: ct-cl3 6s infinite; }
      .ct-cl4 { animation: ct-cl4 6s infinite; }

      /* Key press flashes — different periods so they look random */
      .ct-key-flash { opacity: 0; }
      .ct-kf1 { animation: ct-kflash 0.6s infinite; }
      .ct-kf2 { animation: ct-kflash 0.8s infinite; animation-delay: -0.25s; }
      .ct-kf3 { animation: ct-kflash 0.5s infinite; animation-delay: -0.1s; }
      .ct-kf4 { animation: ct-kflash 0.7s infinite; animation-delay: -0.45s; }
      .ct-kf5 { animation: ct-kflash 0.55s infinite; animation-delay: -0.3s; }
      .ct-kf6 { animation: ct-kflash 0.9s infinite; animation-delay: -0.5s; }

      /* Data particles (float up behind ct-screen) */
      .ct-data-bit { opacity: 0; animation: ct-float-data 1.5s infinite linear; }
      .ct-d1 { animation-delay: 0s; }
      .ct-d2 { animation-delay: -0.4s; }
      .ct-d3 { animation-delay: -0.8s; }
      .ct-d4 { animation-delay: -1.2s; }

      /* Shadow */
      .ct-shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: ct-shadow-bob 0.4s infinite ease-in-out;
      }

      /* ==================== Keyframes ==================== */

      @keyframes ct-body-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(0.8px); }
      }
      @keyframes ct-breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }
      @keyframes ct-shadow-bob {
        0%, 100% { transform: scaleX(1.02); opacity: 0.5; }
        50% { transform: scaleX(1.05); opacity: 0.55; }
      }

      @keyframes ct-type-l {
        0%   { transform: rotate(-5deg); }
        25%  { transform: rotate(-38deg); }
        50%  { transform: rotate(-10deg); }
        75%  { transform: rotate(-30deg); }
        100% { transform: rotate(-5deg); }
      }
      @keyframes ct-type-r {
        0%   { transform: rotate(5deg); }
        25%  { transform: rotate(38deg); }
        50%  { transform: rotate(10deg); }
        75%  { transform: rotate(30deg); }
        100% { transform: rotate(5deg); }
      }

      /* Eyes: long ct-keyboard squint → 2 consecutive scans → ct-keyboard */
      @keyframes ct-eye-code {
        0%   { transform: translate(0, 1px) scaleY(0.6); }
        14%  { transform: translate(0, 1px) scaleY(0.6); }
        15%  { transform: translate(0, 1px) scaleY(0.1); }
        16%  { transform: translate(0, 1px) scaleY(0.6); }
        36%  { transform: translate(0, 1px) scaleY(0.6); }
        37%  { transform: translate(0, 1px) scaleY(0.1); }
        38%  { transform: translate(0, 1px) scaleY(0.6); }
        54%  { transform: translate(0, 1px) scaleY(0.6); }
        55%  { transform: translate(0, 1px) scaleY(0.1); }
        57%  { transform: translate(-1px, -0.5px) scaleY(1); }
        62%  { transform: translate(1.5px, -0.5px) scaleY(1); }
        64%  { transform: translate(-0.5px, -0.3px) scaleY(1); }
        69%  { transform: translate(1.5px, -0.5px) scaleY(1); }
        71%  { transform: translate(1px, -0.3px) scaleY(0.1); }
        73%  { transform: translate(0, 1px) scaleY(0.6); }
        89%  { transform: translate(0, 1px) scaleY(0.6); }
        90%  { transform: translate(0, 1px) scaleY(0.1); }
        91%  { transform: translate(0, 1px) scaleY(0.6); }
        100% { transform: translate(0, 1px) scaleY(0.6); }
      }

      /* Code lines: grow from left → hold → slide up + fade out
         Each line staggers by ~15%. Slide-up gives "scroll" feel.
         At 95-100% all invisible → brief blank → cycle restarts */
      @keyframes ct-cl1 {
        0%        { transform: scaleX(0); opacity: 0; }
        3%        { transform: scaleX(0); opacity: 1; }
        13%       { transform: scaleX(1); opacity: 1; }
        13%, 78%  { transform: scaleX(1) translateY(0); opacity: 1; }
        88%       { transform: scaleX(1) translateY(-3px); opacity: 0; }
        89%, 100% { transform: scaleX(0) translateY(0); opacity: 0; }
      }
      @keyframes ct-cl2 {
        0%, 14%   { transform: scaleX(0); opacity: 0; }
        15%       { transform: scaleX(0); opacity: 1; }
        27%       { transform: scaleX(1); opacity: 1; }
        27%, 82%  { transform: scaleX(1) translateY(0); opacity: 1; }
        91%       { transform: scaleX(1) translateY(-3px); opacity: 0; }
        92%, 100% { transform: scaleX(0) translateY(0); opacity: 0; }
      }
      @keyframes ct-cl3 {
        0%, 29%   { transform: scaleX(0); opacity: 0; }

  <defs>
    <style>
      /* Bouncing Character Body */
      .hw-bounce-anim {
        transform-box: fill-box;
        transform-origin: 50% 100%; /* Base of the feet */
        animation: hw-bounce 1s infinite ease-in-out;
      }
      
      /* Ground Shadow Pulse */
      .hw-shadow-anim {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: hw-shadow 1s infinite ease-in-out;
      }

      /* Enthusiastic Waving Arms */
      .hw-arm-l {
        transform-box: fill-box;
        transform-origin: 100% 50%; /* Shoulder joint */
        animation: hw-wave-l 0.15s infinite alternate ease-in-out;
      }
      .hw-arm-r {
        transform-box: fill-box;
        transform-origin: 0% 50%; /* Shoulder joint */
        animation: hw-wave-r 0.15s infinite alternate ease-in-out;
      }

      /* Happy Blinking Eyes */
      .hw-eyes-blink {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: hw-blink 2s infinite linear;
      }

      /* Pixel-Art Sparkle Animations (Frame-by-frame style) */
      .hw-spark-center {
        opacity: 0;
        animation: hw-flash-center 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }
      
      .hw-spark-outer {
        opacity: 0;
        animation: hw-flash-outer 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }

      /* Character Keyframes */
      @keyframes hw-bounce {
        0%, 15%, 100% { transform: translateY(0) scaleY(1); }
        20% { transform: translateY(0) scaleY(0.85); }     /* Anticipation squash */
        40% { transform: translateY(-10px) scaleY(1.05); } /* Fast up + stretch */
        50% { transform: translateY(-12px) scaleY(1); }    /* Hangtime peak */
        60% { transform: translateY(-10px) scaleY(1.05); } /* Fast fall + stretch */
        80% { transform: translateY(0) scaleY(0.85); }     /* Landing squash */
        85% { transform: translateY(0) scaleY(1); }        /* Recover */
      }

      @keyframes hw-shadow {
        0%, 15%, 100% { transform: scale(1); opacity: 0.5; }
        20% { transform: scale(1.1); opacity: 0.6; }
        40% { transform: scale(0.6); opacity: 0.2; }
        50% { transform: scale(0.5); opacity: 0.15; }
        60% { transform: scale(0.6); opacity: 0.2; }
        80% { transform: scale(1.1); opacity: 0.6; }
        85% { transform: scale(1); opacity: 0.5; }
      }

      @keyframes hw-wave-l {
        0% { transform: rotate(45deg); }
        100% { transform: rotate(85deg); }
      }

      @keyframes hw-wave-r {
        0% { transform: rotate(-45deg); }
        100% { transform: rotate(-85deg); }
      }

      @keyframes hw-blink {
        0%, 46%, 54%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }

      /* 
        True 8-Bit Sparkle Timeline:
        1. Small center dot appears
        2. Outer arms appear (Full Star)
        3. Center dot disappears (Hollow Ring)
        4. Everything disappears 
      */
      @keyframes hw-flash-center {
        0%  { opacity: 0; }
        10% { opacity: 1; }  /* Small dot */
        30% { opacity: 0; }  /* Disappears, leaving hollow star */
        100%{ opacity: 0; }
      }
      
      @keyframes hw-flash-outer {
        0%  { opacity: 0; }
        20% { opacity: 1; }  /* Outer arms appear to complete the star */
        40% { opacity: 0; }  /* Entire star disappears */
        100%{ opacity: 0; }
      }
    </style>

  <defs>
    <style>
      /* ===== Independent sub-animations ===== */
      .cj-breathe {
        transform-origin: 7.5px 13px;
        animation: cj-breathe 3.2s infinite ease-in-out;
      }
      .cj-blink {
        transform-origin: 7.5px 9px;
        animation: cj-blink 4s infinite;
      }

      /* ===== Body cj-rock: left-right sway + micro-dip ===== */
      .cj-body-rock {
        transform-origin: 7.5px 15px;
        animation: cj-rock 1.2s infinite ease-in-out;
      }

      /* ===== Shadow ===== */
      .cj-shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: cj-shadow-rock 1.2s infinite ease-in-out;
      }

      /* ===== Arms: alternate catch/throw, synced with cj-rock ===== */
      .cj-arm-juggle-l {
        transform-origin: 1px 10px;
        animation: cj-arm-jl 1.2s infinite ease-in-out;
      }
      .cj-arm-juggle-r {
        transform-origin: 14px 10px;
        animation: cj-arm-jr 1.2s infinite ease-in-out;
      }

      /* ===== Eyes: track balls ===== */
      .cj-eye-track {
        animation: cj-eye-track 2.4s infinite ease-in-out;
      }

      /* ===== Juggling packets: parabolic arc ===== */
      .cj-packet {
        animation: cj-juggle 1.2s infinite;
      }
      .cj-p1 { animation-delay: 0s; fill: #FF5252; }
      .cj-p2 { animation-delay: -0.4s; fill: #FFC107; }
      .cj-p3 { animation-delay: -0.8s; fill: #4CAF50; }

      /* (no sweat — juggling is a steady state, not emergency) */

      /* ===== Keyframes ===== */

      @keyframes cj-breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      @keyframes cj-blink {
        0%, 10%, 100% { transform: scaleY(1); }
        5% { transform: scaleY(0.1); }
      }

      /* Body: center → left-dip → center → right-dip → center */
      @keyframes cj-rock {
        0%, 50%, 100% { transform: rotate(0deg) translateY(0); }
        25% { transform: rotate(-3deg) translateY(0.3px); }
        75% { transform: rotate(3deg) translateY(0.3px); }
      }

      /* Shadow: sway with body */
      @keyframes cj-shadow-rock {
        0%, 50%, 100% { transform: scaleX(1); opacity: 0.5; }
        25% { transform: scaleX(1.03) translateX(-0.3px); opacity: 0.52; }
        75% { transform: scaleX(1.03) translateX(0.3px); opacity: 0.52; }
      }

      /* Left arm: up at 25% (catch left), down at 75% */
      @keyframes cj-arm-jl {
        0%, 50%, 100% { transform: rotate(20deg); }
        25% { transform: rotate(35deg); }
        75% { transform: rotate(5deg); }
      }

      /* Right arm: down at 25%, up at 75% (catch right) */
      @keyframes cj-arm-jr {
        0%, 50%, 100% { transform: rotate(-20deg); }
        25% { transform: rotate(-5deg); }
        75% { transform: rotate(-35deg); }
      }

      /* Eyes: track ball arc left-right */
      @keyframes cj-eye-track {
        0%, 100% { transform: translate(-1px, -1px); }
        15% { transform: translate(0, -1.5px); }
        30% { transform: translate(1px, -1px); }
        45% { transform: translate(1px, 0.5px); }
        50% { transform: translate(1px, -1px); }
        65% { transform: translate(0, -1.5px); }
        80% { transform: translate(-1px, -1px); }
        90% { transform: translate(-1px, 0.5px); }
      }

      /* Juggle: parabolic arc between hands, hang at top
         Packet origin is x=-1 y=-1 (2x2 rect center ~0,0)
         Left hand: x~1, y~10  → translate(2, 10)
         Right hand: x~14, y~10 → translate(14, 10)
         Arc peak: y ~ -1 (well above head) */
      @keyframes cj-juggle {
        0%   { transform: translate(2px, 10px); }
        8%   { transform: translate(4px, 4px); }
        18%  { transform: translate(6px, 0px); }
        30%  { transform: translate(8px, -1px); }
        42%  { transform: translate(10px, 0px); }
        50%  { transform: translate(14px, 10px); }
        58%  { transform: translate(12px, 4px); }
        68%  { transform: translate(10px, 0px); }
        80%  { transform: translate(8px, -1px); }
        92%  { transform: translate(4px, 4px); }
        100% { transform: translate(2px, 10px); }
      }
    </style>
  </defs>

  <defs>
    <style>
      /* Bouncing Character Body */
      .hj-bounce-anim {
        transform-box: fill-box;
        transform-origin: 50% 100%; /* Base of the feet */
        animation: hj-bounce 1s infinite ease-in-out;
      }
      
      /* Ground Shadow Pulse */
      .hj-shadow-anim {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: hj-shadow 1s infinite ease-in-out;
      }

      /* Enthusiastic Waving Arms */
      .hj-arm-l {
        transform-box: fill-box;
        transform-origin: 100% 50%; /* Shoulder joint */
        animation: hj-wave-l 0.15s infinite alternate ease-in-out;
      }
      .hj-arm-r {
        transform-box: fill-box;
        transform-origin: 0% 50%; /* Shoulder joint */
        animation: hj-wave-r 0.15s infinite alternate ease-in-out;
      }

      /* Happy Blinking Eyes */
      .hj-eyes-blink {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: hj-blink 2s infinite linear;
      }

      /* Pixel-Art Sparkle Animations (Frame-by-frame style) */
      .hj-spark-center {
        opacity: 0;
        animation: hj-flash-center 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }
      
      .hj-spark-outer {
        opacity: 0;
        animation: hj-flash-outer 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }

      /* Character Keyframes */
      @keyframes hj-bounce {
        0%, 15%, 100% { transform: translateY(0) scaleY(1); }
        20% { transform: translateY(0) scaleY(0.85); }     /* Anticipation squash */
        40% { transform: translateY(-10px) scaleY(1.05); } /* Fast up + stretch */
        50% { transform: translateY(-12px) scaleY(1); }    /* Hangtime peak */
        60% { transform: translateY(-10px) scaleY(1.05); } /* Fast fall + stretch */
        80% { transform: translateY(0) scaleY(0.85); }     /* Landing squash */
        85% { transform: translateY(0) scaleY(1); }        /* Recover */
      }

      @keyframes hj-shadow {
        0%, 15%, 100% { transform: scale(1); opacity: 0.5; }
        20% { transform: scale(1.1); opacity: 0.6; }
        40% { transform: scale(0.6); opacity: 0.2; }
        50% { transform: scale(0.5); opacity: 0.15; }
        60% { transform: scale(0.6); opacity: 0.2; }
        80% { transform: scale(1.1); opacity: 0.6; }
        85% { transform: scale(1); opacity: 0.5; }
      }

      @keyframes hj-wave-l {
        0% { transform: rotate(45deg); }
        100% { transform: rotate(85deg); }
      }

      @keyframes hj-wave-r {
        0% { transform: rotate(-45deg); }
        100% { transform: rotate(-85deg); }
      }

      @keyframes hj-blink {
        0%, 46%, 54%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }

      /* 
        True 8-Bit Sparkle Timeline:
        1. Small center dot appears
        2. Outer arms appear (Full Star)
        3. Center dot disappears (Hollow Ring)
        4. Everything disappears 
      */
      @keyframes hj-flash-center {
        0%  { opacity: 0; }
        10% { opacity: 1; }  /* Small dot */
        30% { opacity: 0; }  /* Disappears, leaving hollow star */
        100%{ opacity: 0; }
      }
      
      @keyframes hj-flash-outer {
        0%  { opacity: 0; }
        20% { opacity: 1; }  /* Outer arms appear to complete the star */
        40% { opacity: 0; }  /* Entire star disappears */
        100%{ opacity: 0; }
      }
    </style>

            <g transform="translate(225 142) scale(3.5)"><g class="clawd cb-root" shape-rendering="crispEdges">
  <defs>
    <style>
      /* ===== Independent sub-animations ===== */

      /* Breathe 3.2s */
      .cb-breathe {
        transform-origin: 7.5px 13px;
        animation: cb-breathe 3.2s infinite ease-in-out;
      }

      /* Blink 4s */
      .cb-blink {
        transform-origin: 7.5px 9px;
        animation: cb-blink 4s infinite;
      }

      /* ===== Hammer cycle 1.2s ===== */

      /* Body bounce: up-down motion (shared by body + arms) */
      .cb-body-bounce {
        transform-origin: 7.5px 15px;
        animation: cb-body-bounce 1.2s infinite;
      }

      /* Body squash: scale only (torso + hat + eyes, arms excluded) */
      .cb-body-squash {
        transform-origin: 7.5px 15px;
        animation: cb-body-squash 1.2s infinite;
      }

      /* Right arm hammer swing */
      .cb-arm-hammer {
        transform-origin: 14px 10px;
        animation: cb-hammer-swing 1.2s infinite;
      }

      /* Left arm counter-motion */
      .cb-arm-l-rest {
        transform-origin: 2px 10px;
        animation: cb-arm-l-rest 1.2s infinite;
      }

      /* Shadow synced with bounce */
      .cb-shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: cb-shadow-bounce 1.2s infinite;
      }

      /* Hot metal flash */
      .cb-hot-metal {
        animation: cb-metal-glow 1.2s infinite;
      }

      /* Sparks */
      .cb-spark { opacity: 0; }
      .cb-s1 { animation: cb-spark-1 1.2s infinite; }
      .cb-s2 { animation: cb-spark-2 1.2s infinite; }
      .cb-s3 { animation: cb-spark-3 1.2s infinite; }

      /* ===== Eyes 5s ===== */
      .cb-eyes-look {
        animation: cb-eyes-look 5s infinite ease-in-out;
      }

      /* ===== Sweat 6s ===== */
      .cb-sweat {
        opacity: 0;
        animation: cb-sweat-fly 6s infinite;
      }

      /* ==================== Keyframes ==================== */

      @keyframes cb-breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      @keyframes cb-blink {
        0%, 10%, 100% { transform: scaleY(1); }
        5% { transform: scaleY(0.1); }
      }

      /* Body bounce: translateY only (arms share this, stay clean) */
      @keyframes cb-body-bounce {
        0%, 100% { transform: translateY(0); }
        30%      { transform: translateY(-2px); }
        45%      { transform: translateY(0); }
        50%      { transform: translateY(2px); }
        70%      { transform: translateY(0); }
      }

      /* Body squash: scale only (torso+hat+eyes, not arms) */
      @keyframes cb-body-squash {
        0%, 100% { transform: scale(1, 1); }
        30%      { transform: scale(0.95, 1.05); }
        45%      { transform: scale(1, 1); }
        50%      { transform: scale(1.15, 0.85); }
        70%      { transform: scale(1, 1); }
      }

      /* Shadow: lighter on rise, heavier on impact */
      @keyframes cb-shadow-bounce {
        0%, 45%, 70%, 100% { transform: scaleX(1); opacity: 0.5; }
        30%      { transform: scaleX(0.92); opacity: 0.42; }
        50%      { transform: scaleX(1.08); opacity: 0.58; }
      }

      /* Hammer swing: original angles preserved */
      @keyframes cb-hammer-swing {
        0%, 100% { transform: rotate(15deg); }
        30%      { transform: rotate(-45deg); }
        45%      { transform: rotate(40deg); }
        50%      { transform: rotate(125deg); }
        70%      { transform: rotate(15deg); }
      }

      /* Left arm: reacts to hammer rhythm */
      @keyframes cb-arm-l-rest {
        0%, 100% { transform: rotate(0deg); }
        30%      { transform: rotate(15deg); }
        50%      { transform: rotate(-5deg); }
      }

      /* Hot metal glow on impact */
      @keyframes cb-metal-glow {
        0%, 49%  { fill: #FF5252; }
        50%, 60% { fill: #FFF59D; }
        100%     { fill: #FF5252; }
      }

      /* Eyes: mostly watch anvil, occasional glance at hammer */
      @keyframes cb-eyes-look {
        0%, 100% { transform: translate(1.5px, 0.5px); }
        20%      { transform: translate(1.5px, 0.5px); }
        25%      { transform: translate(1px, -0.5px); }
        35%      { transform: translate(1px, -0.5px); }
        40%      { transform: translate(1.5px, 0.5px); }
        70%      { transform: translate(0.3px, 0); }
        80%      { transform: translate(1.5px, 0.5px); }
      }

      /* Sparks: appear at impact, scatter outward */
      @keyframes cb-spark-1 {
        0%, 49%   { opacity: 0; transform: translate(0, 0) scale(0); }
        50%       { opacity: 1; transform: translate(0, 0) scale(1); }
        70%       { opacity: 0; transform: translate(4px, -6px) scale(0); }
        71%, 100% { opacity: 0; transform: translate(0, 0) scale(0); }
      }
      @keyframes cb-spark-2 {
        0%, 49%   { opacity: 0; transform: translate(0, 0) scale(0); }
        50%       { opacity: 1; transform: translate(0, 0) scale(1); }
        70%       { opacity: 0; transform: translate(7px, -1px) scale(0); }
        71%, 100% { opacity: 0; transform: translate(0, 0) scale(0); }
      }
      @keyframes cb-spark-3 {
        0%, 49%   { opacity: 0; transform: translate(0, 0) scale(0); }
        50%       { opacity: 1; transform: translate(0, 0) scale(1); }
        70%       { opacity: 0; transform: translate(3px, 3px) scale(0); }
        71%, 100% { opacity: 0; transform: translate(0, 0) scale(0); }
      }

      /* Sweat: one drop every 6s */
      @keyframes cb-sweat-fly {
        0%, 55%  { opacity: 0; transform: translate(0, 0) scale(0); }
        60%      { opacity: 1; transform: translate(0, 0) scale(1); }
        80%      { opacity: 0; transform: translate(-6px, -6px) scale(0.5); }
        100%     { opacity: 0; }
      }
    </style>

  <defs>
    <style>
      /* ═══ Independent animations (always running) ═══ */

      .cd-breathe {
        transform-origin: 7.5px 13px;
        animation: cd-breathe 3.2s infinite ease-in-out;
      }

      .cd-blink {
        transform-origin: 7.5px 9px;
        animation: cd-blink 4s infinite linear;
      }

      .cd-leg-a {
        animation: cd-sneak-a 0.5s infinite linear;
        transform-origin: top center;
        transform-box: fill-box;
      }
      .cd-leg-b {
        animation: cd-sneak-b 0.5s infinite linear;
        transform-origin: top center;
        transform-box: fill-box;
      }

      .cd-glass-wobble {
        transform-origin: 14px 10px;
        animation: cd-glass-wobble 3s infinite ease-in-out;
      }

      /* ═══ Main 14s timeline ═══ */

      .cd-body-main {
        transform-origin: 7.5px 15px;
        animation: cd-body-main 14s infinite ease-in-out;
      }

      .cd-shadow-main {
        transform-origin: 7.5px 15.5px;
        animation: cd-shadow-main 14s infinite ease-in-out;
      }

      .cd-arm-l {
        transform-origin: 1px 10px;
        animation: cd-arm-l 14s infinite ease-in-out;
      }

      .cd-arm-r {
        transform-origin: 14px 10px;
        animation: cd-arm-r 14s infinite ease-in-out;
      }

      .cd-glass-vis {
        animation: cd-glass-vis 14s infinite linear;
      }

      .cd-eye-squint {
        transform-origin: 4.5px 9px;
        animation: cd-eye-squint 14s infinite ease-in-out;
      }

      .cd-legs-idle {
        animation: cd-legs-idle 14s infinite linear;
      }

      .cd-legs-sneak {
        animation: cd-legs-sneak 14s infinite linear;
      }

      /* ═══ Independent keyframes ═══ */

      @keyframes cd-breathe {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      @keyframes cd-blink {
        0%, 10%, 100% { transform: scaleY(1); }
        5% { transform: scaleY(0.1); }
      }

      @keyframes cd-sneak-a {
        0%, 100% { transform: rotate(0deg) scaleY(1); }
        50% { transform: rotate(-25deg) scaleY(0.7); }
      }
      @keyframes cd-sneak-b {
        0%, 100% { transform: rotate(-25deg) scaleY(0.7); }
        50% { transform: rotate(0deg) scaleY(1); }
      }

      @keyframes cd-glass-wobble {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(-3deg) scale(1.05); }
      }

      /* ═══ Main timeline keyframes (14s) ═══ */

      /* Body: idle → hunch + patrol → idle (both idle phases trimmed) */
      @keyframes cd-body-main {
        0%, 3%    { transform: translate(0, 0) rotate(0deg); }
        15%       { transform: translate(0, 1px) rotate(2deg); }
        22%       { transform: translate(-2px, 1px) rotate(2deg); }
        35%       { transform: translate(3px, 1px) rotate(2deg); }
        48%       { transform: translate(-2px, 1px) rotate(2deg); }
        61%       { transform: translate(2px, 1px) rotate(2deg); }
        78%       { transform: translate(0, 1px) rotate(2deg); }
        90%       { transform: translate(0, 0) rotate(0deg); }
        96%, 100% { transform: translate(0, 0) rotate(0deg); }
      }

      /* Shadow: follows body X, shrinks during detective */
      @keyframes cd-shadow-main {
        0%, 3%    { transform: scaleX(1) translate(0, 0); opacity: 0.5; }
        15%       { transform: scale(0.9) translate(0, 0); opacity: 0.4; }
        22%       { transform: scale(0.9) translate(-2px, 0); opacity: 0.4; }
        35%       { transform: scale(0.9) translate(3px, 0); opacity: 0.4; }
        48%       { transform: scale(0.9) translate(-2px, 0); opacity: 0.4; }
        61%       { transform: scale(0.9) translate(2px, 0); opacity: 0.4; }
        78%       { transform: scale(0.9) translate(0, 0); opacity: 0.4; }
        90%       { transform: scaleX(1) translate(0, 0); opacity: 0.5; }
        96%, 100% { transform: scaleX(1) translate(0, 0); opacity: 0.5; }
      }

      /* Left arm: normal → tucked behind → normal */
      @keyframes cd-arm-l {
        0%, 5%    { transform: translate(0, 0) rotate(0deg); }
        15%, 78%  { transform: translate(1px, -1px) rotate(15deg); }
        90%, 100% { transform: translate(0, 0) rotate(0deg); }
      }

      /* Right arm: lifts briefly when glass appears/disappears */
      @keyframes cd-arm-r {
        0%, 4%    { transform: translate(0, 0); }
        7%, 10%   { transform: translate(0, -2px); }
        13%, 80%  { transform: translate(0, 0); }
        83%, 86%  { transform: translate(0, -2px); }
        90%, 100% { transform: translate(0, 0); }
      }

      /* Magnifying glass: appears while arm is up, vanishes while arm is up */
      @keyframes cd-glass-vis {
        0%, 8.9%  { opacity: 0; }
        9%        { opacity: 1; }
        83.9%     { opacity: 1; }
        84%       { opacity: 0; }
        100%      { opacity: 0; }
      }

      /* Left eye: normal → squint → normal */
      @keyframes cd-eye-squint {
        0%, 10%   { transform: scaleY(1); }
        15%, 78%  { transform: scaleY(0.5); }
        86%, 100% { transform: scaleY(1); }
      }

      /* Idle legs: visible in idle, hidden in detective */
      @keyframes cd-legs-idle {
        0%, 13.9% { opacity: 1; }
        14%       { opacity: 0; }
        85.9%     { opacity: 0; }
        86%       { opacity: 1; }
        100%      { opacity: 1; }
      }

      /* Sneak legs: hidden in idle, visible in detective */
      @keyframes cd-legs-sneak {
        0%, 13.9% { opacity: 0; }
        14%       { opacity: 1; }
        85.9%     { opacity: 1; }
        86%       { opacity: 0; }
        100%      { opacity: 0; }
      }

  <defs>
    <style>
      /* Bouncing Character Body */
      .cc-bounce-anim {
        transform-box: fill-box;
        transform-origin: 50% 100%; /* Base of the feet */
        animation: cc-bounce 1s infinite ease-in-out;
      }
      
      /* Ground Shadow Pulse */
      .cc-shadow-anim {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: cc-shadow 1s infinite ease-in-out;
      }

      /* Enthusiastic Waving Arms */
      .cc-arm-l {
        transform-box: fill-box;
        transform-origin: 100% 50%; /* Shoulder joint */
        animation: cc-wave-l 0.15s infinite alternate ease-in-out;
      }
      .cc-arm-r {
        transform-box: fill-box;
        transform-origin: 0% 50%; /* Shoulder joint */
        animation: cc-wave-r 0.15s infinite alternate ease-in-out;
      }

      /* Happy Blinking Eyes */
      .cc-eyes-blink {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: cc-blink 2s infinite linear;
      }

      /* Pixel-Art Sparkle Animations (Frame-by-frame style) */
      .cc-spark-center {
        opacity: 0;
        animation: cc-flash-center 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }
      
      .cc-spark-outer {
        opacity: 0;
        animation: cc-flash-outer 1.5s infinite step-end;
        animation-delay: var(--delay, 0s);
      }

      /* Character Keyframes */
      @keyframes cc-bounce {
        0%, 15%, 100% { transform: translateY(0) scaleY(1); }
        20% { transform: translateY(0) scaleY(0.85); }     /* Anticipation squash */
        40% { transform: translateY(-10px) scaleY(1.05); } /* Fast up + stretch */
        50% { transform: translateY(-12px) scaleY(1); }    /* Hangtime peak */
        60% { transform: translateY(-10px) scaleY(1.05); } /* Fast fall + stretch */
        80% { transform: translateY(0) scaleY(0.85); }     /* Landing squash */
        85% { transform: translateY(0) scaleY(1); }        /* Recover */
      }

      @keyframes cc-shadow {
        0%, 15%, 100% { transform: scale(1); opacity: 0.5; }
        20% { transform: scale(1.1); opacity: 0.6; }
        40% { transform: scale(0.6); opacity: 0.2; }
        50% { transform: scale(0.5); opacity: 0.15; }
        60% { transform: scale(0.6); opacity: 0.2; }
        80% { transform: scale(1.1); opacity: 0.6; }
        85% { transform: scale(1); opacity: 0.5; }
      }

      @keyframes cc-wave-l {
        0% { transform: rotate(45deg); }
        100% { transform: rotate(85deg); }
      }

      @keyframes cc-wave-r {
        0% { transform: rotate(-45deg); }
        100% { transform: rotate(-85deg); }
      }

      @keyframes cc-blink {
        0%, 46%, 54%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }

      /* 
        True 8-Bit Sparkle Timeline:
        1. Small center dot appears
        2. Outer arms appear (Full Star)
        3. Center dot disappears (Hollow Ring)
        4. Everything disappears 
      */
      @keyframes cc-flash-center {
        0%  { opacity: 0; }
        10% { opacity: 1; }  /* Small dot */
        30% { opacity: 0; }  /* Disappears, leaving hollow star */
        100%{ opacity: 0; }
      }
      
      @keyframes cc-flash-outer {
        0%  { opacity: 0; }
        20% { opacity: 1; }  /* Outer arms appear to complete the star */
        40% { opacity: 0; }  /* Entire star disappears */
        100%{ opacity: 0; }
      }
    </style>

  <script>
    (() => {
      const root = document.documentElement;
      const $ = id => document.getElementById(id);
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      const scenes = {
        idle: { title:'休息一下', speed:'86', unit:'次 / 今日', left:'今天也配合得不错', right:'12.4k tokens', copy:'没有请求的时候，就一起打个盹。', greeting:'嘘，刚才梦到小鱼了。', duration:16000 },

        retry: { title:'正在切换备用渠道', speed:'↻', unit:'重试中', left:'当前渠道响应超时', right:'准备连接渠道 B', copy:'别着急，我们换条路试试。', greeting:'收到，正在修，马上就好。', reaction:'notice', duration:12000 },
        error: { title:'上游暂时不可用', speed:'!', unit:'熔断中', left:'连续请求失败', right:'等待渠道恢复', copy:'先歇一会儿，让小侦探查个明白。', greeting:'还在排查，有消息就告诉你。', reaction:'notice', duration:16000 },
        done: { title:'任务完成', speed:'✓', unit:'已完成', left:'这一程，顺利抵达', copy:'好耶！庆祝一下，再一起打个盹。', greeting:'配合愉快，下次还一起！', reaction:'notice', duration:2800, autoNext:'idle' },
      };
      const order = Object.keys(scenes);
      let mode = 'idle', paused = motion.matches, cycling = false;
      let sceneElapsed = 0, tokenCount = 1024, greetingElapsed = null, previousTime = null, readoutElapsed = 0;
      let rafId = null, playTime = 0, shapeElapsed = 0;
      const whales = [...document.querySelectorAll('.whale-outline')].map(path => ({
        path, points:JSON.parse(path.dataset.points), pivot:path.dataset.pivot.split(',').map(Number), scene:path.closest('.scene').dataset.scene,
      }));

      // Deform one continuous outline near the tail root; detached layers leave
      // visible cracks on a transparent background. White face/belly stay put.
      function moveTails() {
        for(const whale of whales) {
          if(whale.scene !== mode) continue;
          const t=playTime/1000, [px,py]=whale.pivot;
          const phase=(t%6.8)/6.8;
          const amplitude = mode==='surf' ? .085 : mode==='error' ? .006 : mode==='retry' ? .015 : .045;
          const angle=mode==='idle' ? (phase > .65 ? Math.sin((phase-.65)/.35*Math.PI*2)*.045 : 0) : Math.sin(t*Math.PI*2/(mode==='surf'?1.45:2.8))*amplitude;
          const smooth = value => { const n=Math.max(0,Math.min(1,value)); return n*n*(3-2*n); };
          const loops=whale.points.map(points=>points.map(([x,y])=>{
            const weight=smooth((x-(px-24))/20)*smooth((py+8-y)/24), a=angle*weight;
            return [px+(x-px)*Math.cos(a)-(y-py)*Math.sin(a),py+(x-px)*Math.sin(a)+(y-py)*Math.cos(a)];
          }));
          const n=value=>Number(value.toFixed(2));
          whale.path.setAttribute('d',loops.map(points=>points.map((p,i)=>{
            const prev=points[(i+points.length-1)%points.length], next=points[(i+1)%points.length];
            const a=Math.min(.25,.7/Math.hypot(p[0]-prev[0],p[1]-prev[1])), b=Math.min(.25,.7/Math.hypot(next[0]-p[0],next[1]-p[1]));
            return `${i?'L':'M'}${n(p[0]+(prev[0]-p[0])*a)} ${n(p[1]+(prev[1]-p[1])*a)}Q${n(p[0])} ${n(p[1])} ${n(p[0]+(next[0]-p[0])*b)} ${n(p[1]+(next[1]-p[1])*b)}`;
          }).join('')+'Z').join(''));
        }
      }

      function announce(message) { $('announcement').textContent = message; }

        const scene = scenes[mode];
        $('model').textContent = scene.title;
        $('speed').textContent = scene.speed;
        $('speed-unit').textContent = scene.unit;
        $('meta-left').textContent = scene.left;
        $('meta-right').textContent = scene.right || `${Math.floor(tokenCount).toLocaleString('en-US')} tokens`;
        $('scene-copy').textContent = scene.copy;
      }
      function stopGreeting() { greetingElapsed = null; root.dataset.greeting = 'false'; }
      function setScene(next, manual = true) {
        if (!scenes[next]) return;
        if (manual) { cycling = false; $('cycle').setAttribute('aria-pressed','false'); }
        mode = next; root.dataset.scene = next; sceneElapsed = 0; previousTime = null;
        if (scenes[next].rate) tokenCount = 1024;
        stopGreeting();
        document.querySelectorAll('.scene').forEach(el => el.classList.toggle('is-active',el.dataset.scene === next));
        // Restart finite entrance/completion actions when re-entering a scene.
        // Leave the opacity transition alone so the scene change still blends.
        document.querySelector('.scene.is-active').getAnimations({subtree:true}).forEach(animation=>{
          if (animation instanceof CSSAnimation) animation.currentTime = 0;
        });
        document.querySelectorAll('[data-mode]').forEach(el => el.setAttribute('aria-pressed',String(el.dataset.mode === next)));
        renderReadout(); announce(`${scenes[next].title}，${paused ? '动画已暂停' : '正在播放'}`);
      }
      function setPaused(value) {
        paused = value; root.dataset.paused = String(value); previousTime = null;
        const label = value ? '继续播放' : '暂停动画';
        $('pause').setAttribute('aria-label',label); $('pause').title = label;
        $('pause').setAttribute('aria-pressed',String(value));
        $('pause-icon').setAttribute('d',value ? 'M8 5l11 7-11 7Z' : 'M8 5v14M16 5v14');
        announce(value ? '动画已暂停' : '继续播放');
      }
      function greet() {
        if (paused) { announce('动画已暂停，继续播放后可以打招呼'); return; }
        greetingElapsed = 0; root.dataset.greeting = 'true'; root.dataset.reaction = scenes[mode].reaction || 'cheer'; previousTime = null;
        $('greeting-caption').textContent = scenes[mode].greeting;
        document.querySelector('.scene.is-active .hello-clawd')?.getAnimations({subtree:true}).forEach(animation=>{ animation.currentTime = 0; });
        announce(scenes[mode].greeting);
      }
      function tick(time) {
        rafId = null;
        // Use elapsed time, not a capped frame delta: a low frame rate must not
        // stretch a two-second greeting or the 12–16 second scene timer.
        // Background tabs reset previousTime in visibilitychange instead.
        const dt = previousTime === null ? 0 : Math.max(0, time - previousTime);
        previousTime = time;
        if (!paused) {
          playTime += dt; shapeElapsed += dt;
          if(shapeElapsed >= 40) { shapeElapsed=0; moveTails(); }
          sceneElapsed += dt;
          if (scenes[mode].rate) tokenCount += scenes[mode].rate * dt / 1000;
          if (greetingElapsed !== null) { greetingElapsed += dt; if (greetingElapsed >= 2100) stopGreeting(); }
          if ((cycling || scenes[mode].autoNext) && sceneElapsed >= scenes[mode].duration) setScene(scenes[mode].autoNext || order[(order.indexOf(mode)+1)%order.length],false);
          readoutElapsed += dt;
          if (readoutElapsed >= 160) { readoutElapsed = 0; if (scenes[mode].rate) $('meta-right').textContent = `${Math.floor(tokenCount).toLocaleString('en-US')} tokens`; }
        }
        if (!document.hidden) rafId = requestAnimationFrame(tick);
      }
      document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>setScene(button.dataset.mode)));
      $('pet').addEventListener('click',greet);
      $('pause').addEventListener('click',()=>setPaused(!paused));
      $('theme').addEventListener('click',()=>{
        const light = root.dataset.theme !== 'light'; root.dataset.theme = light ? 'light' : 'dark';
        const label = light ? '切换到深色' : '切换到浅色'; $('theme').setAttribute('aria-label',label); $('theme').title = label; $('theme').setAttribute('aria-pressed',String(light));
      });
      $('size').addEventListener('click',()=>{
        const large = root.dataset.size !== 'large'; root.dataset.size = large ? 'large' : 'normal';
        $('size').setAttribute('aria-pressed',String(large)); const label = large ? '恢复实际尺寸' : '放大查看'; $('size').setAttribute('aria-label',label); $('size').title = label;
      });
      $('cycle').addEventListener('click',()=>{ cycling = !cycling; sceneElapsed = 0; previousTime = null; $('cycle').setAttribute('aria-pressed',String(cycling)); announce(cycling ? '自动切换已开启，普通场景停留 12 至 16 秒，完成后短暂庆祝并回到待机' : '自动切换已关闭'); });
      document.addEventListener('keydown',event=>{
        if (event.ctrlKey || event.metaKey || event.altKey || event.target.isContentEditable) return;
        if (/^[1-6]$/.test(event.key)) setScene(order[Number(event.key)-1]);
      });
      motion.addEventListener('change',event=>{ if(event.matches) setPaused(true); });
      document.addEventListener('visibilitychange',()=>{
        if (document.hidden) { if(rafId !== null) cancelAnimationFrame(rafId); rafId = null; root.dataset.paused='true'; }
        else { root.dataset.paused=String(paused); previousTime = null; if(rafId === null) rafId=requestAnimationFrame(tick); }
      });
      setPaused(paused); renderReadout(); rafId=requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
